name: Claude PR Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - '*'  # Triggers on PRs to any branch (main, DEV, STAGE, etc.)

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for better diff analysis
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: |
            **/*.py
            **/*.js
            **/*.ts
            **/*.tsx
            **/*.jsx
            **/*.html
            **/*.css
            **/*.md
            **/*.json
            **/*.yml
            **/*.yaml
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install anthropic
      
      - name: Review code with Claude
        id: claude-review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: |
          python3 .github/scripts/claude_review.py > review_output.txt
          echo "review<<EOF" >> $GITHUB_OUTPUT
          cat review_output.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: Post review as PR comment
        uses: actions/github-script@v7
        if: steps.claude-review.outputs.review != ''
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const review = `${{ steps.claude-review.outputs.review }}`;
            const body = `## 🤖 Claude Code Review\n\n${review}\n\n---\n*This review was automatically generated by Claude AI.*`;
            
            const prNumber = context.payload.pull_request?.number || context.payload.number;
            
            github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

