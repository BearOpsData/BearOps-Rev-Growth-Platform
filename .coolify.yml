# Coolify Configuration File
# This helps Coolify understand your application better

version: '1.0'

# Application metadata
name: bearops-rev-growth-platform
description: BearOps Revenue Growth Platform - Full Stack Next.js Application

# Build configuration
build:
  dockerfile: Dockerfile
  context: .
  
# Port configuration
ports:
  - container: 3000
    public: auto  # Coolify will assign a public port

# Environment variables
environment:
  - NODE_ENV=production
  - NEXT_TELEMETRY_DISABLED=1

# Health check
healthcheck:
  path: /
  interval: 30
  timeout: 10
  retries: 3

# Resource limits (optional, Coolify will manage)
resources:
  limits:
    memory: 2G
    cpus: '2'

